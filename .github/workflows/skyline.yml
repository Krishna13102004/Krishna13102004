name: 3D Skyline Metrics

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Skyline
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Krishna13102004
          filename: metrics.skyline.svg

          plugin_skyline: yes
          plugin_skyline_year: 0
          plugin_skyline_frames: 60
          plugin_skyline_quality: 0.5
          plugin_skyline_compatibility: yes
